{% set name = "flnc2" %}
{% set version = "0.1.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/AmirUCR/flnc2/archive/refs/tags/v0.1.0.tar.gz
  sha256: 9d0abdea84270d0f73dbdefc67cb86193bd052fac75c79bb173e7797d1b43624   # curl -sL <url> | sha256sum

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - flnc2 = flnc2.main:main
    - flnc2-cv = flnc2.tools.cv_harness:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}


requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    # Python libraries
    - numpy
    - pandas
    - scipy
    - matplotlib-base
    - pyyaml
    - biopython
    - pybedtools
    - gffutils
    - pyfaidx
    - scikit-learn
    - tensorflow >=2.16
    - bedtools
    - cpat >=3
    - hisat2
    - samtools
    - seqtk
    - stringtie
    - subread
    - rseqc

test:
  requires:
    - python {{ python_min }}
  imports:
    - flnc2
  commands:
    - flnc2 --help
    - flnc2-cv --help
    - cpat --help
    - stringtie --version
    - featureCounts -v
    - hisat2 --version

about:
  home: https://github.com/AmirUCR/flnc2
  license: MIT                  # match pyproject.toml
  license_family: MIT
  license_file: LICENSE
  summary: Identification of lncRNAs from RNA-seq data using deep learning
  dev_url: https://github.com/AmirUCR/flnc2

extra:
  recipe-maintainers:
    - AmirUCR
    